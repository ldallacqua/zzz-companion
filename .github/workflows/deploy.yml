name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v6
      - name: Build static site
        run: pnpm build:static
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          # Public URL of the accounts API (apps/api), set as a repository variable once it is
          # deployed. Empty = accounts are off and rosters stay on each device (ADR 0011).
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      - name: Build Storybook into /storybook
        run: pnpm --filter @zzz/web exec storybook build -o out/storybook
        env:
          # Same base path as the site, so assets from public/ (e.g. the logo) resolve on Pages.
          BASE_PATH: /${{ github.event.repository.name }}
      - run: touch apps/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
